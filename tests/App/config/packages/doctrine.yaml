doctrine:
    dbal:
        driver: pdo_sqlite
        path: '%kernel.project_dir%/tests/App/var/test.db'
        charset: utf8mb4
    orm:
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        auto_mapping: true
        mappings:
            # Mapping for test fixtures (CustomPlatformParameter used in tests)
            # In a real project, users don't need this - the bundle auto-configures
            # Doctrine mapping based on platform_parameter.entity_class
            TestFixtures:
                type: attribute
                dir: '%kernel.project_dir%/tests/Fixtures'
                prefix: 'Ecourty\PlatformParameterBundle\Tests\Fixtures'
                alias: TestFixtures
