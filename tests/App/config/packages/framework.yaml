framework:
    secret: 'test-secret'
    test: true
    router:
        utf8: true
    session:
        storage_factory_id: session.storage.factory.mock_file
        cookie_secure: auto
        cookie_samesite: lax
        handler_id: ~
    http_method_override: true
    translator:
        default_path: '%kernel.project_dir%/tests/App/translations'
    property_access: true
    validation:
        enabled: true
    form:
        enabled: true
    csrf_protection: true
    assets:
        enabled: true
