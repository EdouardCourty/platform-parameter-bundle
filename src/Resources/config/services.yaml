services:
    _defaults:
        autowire: true
        autoconfigure: true

    Ecourty\PlatformParameterBundle\:
        resource: '../../*'
        exclude: '../../{Controller,Entity,Enum,Exception,EventListener,Resources}'

    Ecourty\PlatformParameterBundle\Contract\PlatformParameterProviderInterface:
        alias: Ecourty\PlatformParameterBundle\Service\PlatformParameterProvider
        public: true

    # Note: PlatformParameterProvider is configured programmatically in PlatformParameterExtension
    # to inject the correct cache adapter with dynamic configuration

    # Commands configuration
    Ecourty\PlatformParameterBundle\Command\ListCommand:
        arguments:
            $entityClass: '%platform_parameter.entity_class%'

    Ecourty\PlatformParameterBundle\Command\GetCommand:
        arguments:
            $entityClass: '%platform_parameter.entity_class%'

    Ecourty\PlatformParameterBundle\Command\SetCommand:
        arguments:
            $entityClass: '%platform_parameter.entity_class%'

    Ecourty\PlatformParameterBundle\Command\DeleteCommand:
        arguments:
            $entityClass: '%platform_parameter.entity_class%'

